# Local environment that runs ONLY the application image.
#
# PostgreSQL, Redis, MinIO and Mailpit are ALREADY RUNNING as separate
# containers on this machine. This file does NOT start its own copies — it
# points the app at the existing ones through their host-published ports
# (reached from inside the container as host.docker.internal).
#
#   docker compose -f docker-compose.local.yml up -d --build
#
# Existing containers this file targets:
#   postgres  -> postgres:18       :5432   user "postgres" / pw "postgres"
#   redis-8   -> redis:8           :6379   no auth
#   minio     -> minio/minio       :9000   minioadmin / minioadmin
#   mailpit   -> axllent/mailpit   :1025 (SMTP) / :8025 (UI)
#
# One-time prep inside those containers:
#   docker exec postgres createdb -U postgres laravel
#   docker run --rm --network host --entrypoint sh minio/mc:latest -c \
#     "mc alias set l http://127.0.0.1:9000 minioadmin minioadmin && mc mb -p l/local"
#
# NOTE: env values are literal on purpose. `docker compose` resolves ${VAR}
# against the Laravel .env in this directory, so using ${...} here would
# silently inherit REDIS_HOST / MAIL_HOST / etc. from that file. Override by
# editing this file or with a compose override file.

services:
    app:
        build:
            context: .
            # Builds on top of the pushed nexudev/laravel-starter runtime image
            # (skips the from-source PHP-extension compile).
            dockerfile: Dockerfile
            target: production
        image: laravel-starter:local
        restart: unless-stopped
        # Resolves host-published services from inside the container (also on Linux).
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            APP_NAME: 'Laravel'
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_KEY: 'base64:cKY0arNdwbFl3cOgnFA4/nrL3TOVXGdYM1hUhPeWEQQ='
            APP_URL: 'http://localhost:8000'

            LOG_CHANNEL: stack
            LOG_STACK: single
            LOG_LEVEL: debug

            # --- existing PostgreSQL 18 container ------------------------------
            DB_CONNECTION: pgsql
            DB_HOST: host.docker.internal
            DB_PORT: '5432'
            DB_DATABASE: laravel
            DB_USERNAME: postgres
            DB_PASSWORD: postgres

            # --- existing Redis 8 container -----------------------------------
            REDIS_CLIENT: phpredis
            REDIS_HOST: host.docker.internal
            REDIS_PORT: '6379'
            REDIS_PASSWORD: 'null'

            CACHE_STORE: redis
            QUEUE_CONNECTION: redis
            SESSION_DRIVER: redis
            SESSION_COOKIE: app_session
            BROADCAST_CONNECTION: log

            # --- existing MinIO container ---------------------------------
            # ENDPOINT is server-to-server (from inside this container);
            # URL is what the browser uses to fetch public objects.
            FILESYSTEM_DISK: s3
            AWS_ACCESS_KEY_ID: minioadmin
            AWS_SECRET_ACCESS_KEY: minioadmin
            AWS_DEFAULT_REGION: us-east-1
            AWS_BUCKET: local
            AWS_ENDPOINT: 'http://host.docker.internal:9000'
            AWS_URL: 'http://localhost:9000/local'
            AWS_USE_PATH_STYLE_ENDPOINT: 'true'

            # --- existing Mailpit container ------------------------------
            MAIL_MAILER: smtp
            MAIL_HOST: host.docker.internal
            MAIL_PORT: '1025'
            MAIL_USERNAME: 'null'
            MAIL_PASSWORD: 'null'
            MAIL_SCHEME: 'null'
            MAIL_FROM_ADDRESS: 'hello@example.com'
            MAIL_FROM_NAME: 'Laravel'

            # Migrations run on start for local convenience; unset for production.
            RUN_MIGRATIONS: 'true'
            WAIT_FOR_DB: 'true'
            OCTANE_WORKERS: 'auto'
            OCTANE_MAX_REQUESTS: '500'
        ports:
            - '${APP_PORT:-8000}:8000'

# ---------------------------------------------------------------------------
# Alternative: address the existing services by container name
# ---------------------------------------------------------------------------
# If postgres/redis/minio/mailpit are moved onto a shared user-defined network
# (say "infra_default"), attach the app to it and swap the *_HOST values above
# for the container names (postgres, redis-8, minio, mailpit):
#
#   services:
#     app:
#       networks: [default, infra]
#   networks:
#     infra:
#       external: true
#       name: infra_default
