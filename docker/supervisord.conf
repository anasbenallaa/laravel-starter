[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:octane]
command=/bin/sh -c "exec php /app/artisan octane:start --server=frankenphp --caddyfile=/app/docker/frankenphp/Caddyfile --host=0.0.0.0 --port=8000 --workers=${OCTANE_WORKERS:-auto} --max-requests=1000"
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:horizon]
command=php /app/artisan horizon
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=2
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

; Runs due scheduled tasks every minute, including queuing each laboratory's
; order synchronization. Scheduled tasks are guarded with onOneServer, so
; running this in more than one container is safe.
[program:scheduler]
command=php /app/artisan schedule:work
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=2
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
